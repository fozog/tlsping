[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tlsping"
version = "0.1.0"
description = "A small hello-world style Python project using cryptography"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "cryptography>=42.0.0",
    "dnspython>=2.0.0",
    "python-whois>=0.9.5",
]

[project.scripts]
tlsping = "tlsping.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
